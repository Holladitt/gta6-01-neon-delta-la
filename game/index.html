<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Delta LA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; font-family: Arial, Helvetica, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #hud-money { position: absolute; top: 18px; right: 22px; text-align: right; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
  #hud-money .money { font-size: 34px; font-weight: bold; color: #7dff9a; }
  #hud-money .stars { font-size: 26px; color: #ffc300; letter-spacing: 2px; }
  #hud-money .rankline, #hud-money .healthline { font-size: 13px; color: #e8e8e8; letter-spacing: 1px; margin-top: 2px; }
  #hud-dispatch { position: absolute; top: 18px; left: 22px; background: rgba(8, 16, 26, 0.82); border-left: 4px solid #4a90ff; padding: 10px 14px; min-width: 240px; display: none; }
  #hud-dispatch .dp-head { font-size: 13px; font-weight: bold; color: #8ab8ff; letter-spacing: 1px; }
  #hud-dispatch .dp-status { font-size: 12px; color: #ffc300; margin: 4px 0 6px; }
  #hud-dispatch .dp-unit { font-size: 13px; display: flex; gap: 8px; padding: 1px 0; }
  #hud-dispatch .dp-call { font-weight: bold; width: 74px; }
  #hud-dispatch .dp-role { color: #9fd4e8; flex: 1; }
  #hud-dispatch .dp-dist { color: #ccc; }
  #hud-dispatch .dp-more { font-size: 12px; color: #9aa; margin-top: 4px; }
  #hud-crew { position: absolute; left: 22px; top: 220px; background: rgba(8, 16, 26, 0.72); padding: 10px 14px; font-size: 12px; }
  #hud-crew .crew-head { font-weight: bold; letter-spacing: 2px; color: #2ec4b6; margin-bottom: 5px; }
  #hud-crew .crew-row { display: flex; gap: 7px; align-items: center; padding: 1px 0; }
  #hud-crew .crew-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #hud-crew .crew-name { font-weight: bold; }
  #hud-crew .crew-role { color: #9aa; }
  #hud-crew .crew-keys { margin-top: 7px; color: #d8d8d8; line-height: 1.7; }
  #hud-district { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); text-align: center; transition: opacity 0.8s; text-shadow: 0 3px 12px rgba(0,0,0,0.9); }
  #hud-district .dist-name { font-size: 64px; font-weight: bold; font-style: italic; letter-spacing: 3px; }
  #hud-district .dist-sub { font-size: 18px; color: #d8e8f0; letter-spacing: 4px; }
  #hud-mission { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); background: rgba(8, 16, 26, 0.82); border-top: 3px solid #ffc300; padding: 10px 22px; text-align: center; min-width: 420px; }
  #hud-mission .m-title { font-size: 17px; font-weight: bold; letter-spacing: 1px; }
  #hud-mission .m-stage { font-size: 14px; color: #ffc300; margin: 3px 0; }
  #hud-mission .m-contact { font-size: 12px; color: #bcd; }
  #hud-minimap-wrap { position: absolute; left: 22px; bottom: 22px; width: 220px; height: 220px; }
  #hud-minimap { width: 220px; height: 220px; }
  #hud-speed { position: absolute; right: 26px; bottom: 26px; text-align: right; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
  #hud-speed .speed-num { font-size: 64px; font-weight: bold; font-style: italic; }
  #hud-speed .speed-unit { font-size: 14px; letter-spacing: 4px; color: #d8d8d8; }
  #hud-weapon { position: absolute; right: 26px; bottom: 140px; text-align: right; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
  #hud-weapon .w-name { font-size: 20px; font-weight: bold; }
  #hud-weapon .w-ammo { font-size: 16px; color: #ffc300; }
  #hud-radio { position: absolute; right: 26px; top: 190px; font-size: 13px; letter-spacing: 2px; color: #2ec4b6; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
  #hud-hint { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,0.65); letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
  #hud-dialogue { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); background: rgba(8, 16, 26, 0.88); border-left: 4px solid #ff5a5f; padding: 12px 18px; max-width: 560px; display: none; }
  #hud-dialogue .dlg-name { font-size: 14px; font-weight: bold; letter-spacing: 1px; }
  #hud-dialogue .dlg-line { font-size: 15px; margin-top: 4px; line-height: 1.45; }
  #hud-shop { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); width: 470px; background: rgba(10, 18, 28, 0.94); border: 2px solid #ff5a5f; padding: 16px 18px; display: none; pointer-events: auto; }
  #hud-shop .shop-head { font-size: 26px; font-weight: bold; letter-spacing: 2px; color: #ff5a5f; }
  #hud-shop .shop-sub { font-size: 12px; color: #9aa; letter-spacing: 3px; margin: 2px 0 10px; }
  #hud-shop .shop-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,0.15); }
  #hud-shop .shop-name { font-size: 16px; font-weight: bold; width: 140px; }
  #hud-shop .shop-stats { font-size: 12px; color: #bcd; flex: 1; }
  #hud-shop .shop-buy { background: #ff5a5f; color: #fff; border: none; font-size: 14px; font-weight: bold; padding: 8px 14px; cursor: pointer; }
  #hud-shop .shop-buy:disabled { background: #555; cursor: default; }
  #hud-shop .shop-cash { margin-top: 14px; font-size: 14px; color: #7dff9a; }
  #hud-toast { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); background: rgba(8, 16, 26, 0.85); padding: 10px 20px; font-size: 16px; font-weight: bold; letter-spacing: 1px; opacity: 0; transition: opacity 0.4s; text-align: center; }
  #hud-center { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 44px; font-weight: bold; font-style: italic; letter-spacing: 2px; color: #ffc300; text-shadow: 0 4px 16px rgba(0,0,0,0.9); opacity: 0; text-align: center; white-space: pre-line; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0a0e14; color: #fff; font-size: 20px; letter-spacing: 3px; z-index: 10; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="loading">NEON DELTA LA — LOADING THE CITY…</div>
<script type="module">
  import { initGame } from './src/main.js';
  try {
    initGame();
  } catch (e) {
    document.getElementById('loading').textContent = 'FAILED TO LOAD: ' + (e && e.message ? e.message : e);
  }
  const el = document.getElementById('loading');
  if (el) el.remove();
</script>
</body>
</html>
