<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Delta LA: District Wars</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0f1a; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; }
  #game canvas { width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #hud-money { position: absolute; top: 14px; right: 18px; font-size: 26px; font-weight: 800; color: #2ecc71; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-speed { position: absolute; bottom: 18px; right: 22px; font-size: 44px; font-weight: 900; font-style: italic; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.85); }
  #hud-district { position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 900; font-style: italic; letter-spacing: 3px; color: #ffd76a; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
  #hud-cover { position: absolute; top: 14px; left: 18px; font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #minimap { position: absolute; bottom: 18px; left: 18px; width: 160px; height: 160px; border: 3px solid rgba(255,255,255,.7); border-radius: 50%; background: #2c3e50; }
  #mission-bar { position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 11; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  #mb-title { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #ffd76a; }
  #mb-objective { font-size: 18px; font-weight: 700; color: #fff; }
  #mb-next { font-size: 14px; font-weight: 600; color: #9fc3e8; }
  #dialogue { position: fixed; bottom: 210px; left: 50%; transform: translateX(-50%); width: 640px; max-width: 90vw; background: rgba(10,15,26,.85); border: 2px solid #ffd76a; border-radius: 10px; padding: 14px 16px 14px 96px; z-index: 12; min-height: 100px; }
  /* v26 shot 1 only: the hero car is the hero of the frame and fills the
     lower half, so the bottom-centre HUD would cover it. For shot 1 the
     dialogue moves to the top-left and the mission bar to the top-right
     (over empty sky), leaving the whole lower frame to the car. main.js
     adds body.shot1 only while shot 1 is staged; other shots keep the
     default bottom-centre HUD. */
  body.shot1 #dialogue { top: 90px; bottom: auto; left: 20px; transform: none; }
  /* v28: right 20px put the longest line (NEXT: Lose the tail) hard
     against the right frame edge. 48px clears the edge with room. */
  body.shot1 #mission-bar { top: 90px; bottom: auto; left: auto; right: 48px; transform: none; text-align: right; }
  /* v28 shot 2 only: the bottom-centre mission bar and the VENICE
     label sat on Mara's legs (she fills the centre of the frame down
     to the bottom edge). For this shot they move to the bottom-left
     over the empty forecourt grass — left of the minimap's right edge,
     clear of Mara entirely — keeping the same bottom offsets. */
  body.shot2 #mission-bar { left: 200px; transform: none; text-align: left; }
  body.shot2 #hud-district { left: 200px; transform: none; text-align: left; }
  /* v27 declutter: in staged shots the abstract property panels are
     hidden so the 3D scene dominates the frame — big car / big Mara /
     landmark / dusk light, no big text block competing with the scene.
     The game HUD and all game logic are untouched; only the staged
     screenshot presentation changes. The weapon wheel (tier + price
     list), the shop tier panel (tier + price + OWNED list), the top
     stat bar (COVER / TAPES / RADIO) and the money + stars all hide in
     every staged shot. Story UI stays: dialogue + portrait, mission
     bar, district label, minimap, speed, game title. */
  body.shot1 #wheel, body.shot2 #wheel, body.shot3 #wheel, body.shot4 #wheel { display: none !important; }
  body.shot1 #shop-panel, body.shot2 #shop-panel, body.shot3 #shop-panel, body.shot4 #shop-panel { display: none !important; }
  body.shot1 #hud-cover, body.shot2 #hud-cover, body.shot3 #hud-cover, body.shot4 #hud-cover { display: none !important; }
  body.shot1 #hud-money, body.shot2 #hud-money, body.shot3 #hud-money, body.shot4 #hud-money { display: none !important; }
  .dlg-portrait { position: absolute; left: 12px; top: 12px; width: 72px; height: 72px; border-radius: 6px; }
  .dlg-name { font-size: 15px; font-weight: 900; letter-spacing: 2px; color: #ffd76a; margin-bottom: 4px; }
  .dlg-line { font-size: 17px; line-height: 1.4; color: #fff; }
  #wheel { position: fixed; top: 50%; left: 18px; transform: translateY(-50%); width: 340px; background: rgba(10,15,26,.88); border: 2px solid #e74c3c; border-radius: 12px; padding: 16px; z-index: 13; display: none; }
  .wheel-title { font-size: 18px; font-weight: 900; letter-spacing: 2px; color: #e74c3c; margin-bottom: 10px; text-align: center; }
  .wheel-row { font-size: 16px; font-weight: 700; padding: 8px 10px; border-radius: 6px; color: #bbb; }
  .wheel-row.owned { color: #fff; background: rgba(46,204,113,.25); }
  #shop-panel { position: fixed; top: 90px; right: 18px; width: 300px; background: rgba(10,15,26,.88); border: 2px solid #1abc9c; border-radius: 12px; padding: 14px; z-index: 13; display: none; }
  .shop-title { font-size: 22px; font-weight: 900; letter-spacing: 2px; color: #1abc9c; margin-bottom: 8px; }
  .shop-row { font-size: 15px; font-weight: 700; padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,.15); color: #ddd; }
  .shop-row.owned { color: #2ecc71; }
  .shop-tier { color: #ffd76a; }
  .shop-note { font-size: 12px; color: #9fc3e8; margin-top: 8px; }
  #title-screen { position: fixed; inset: 0; z-index: 20; background: linear-gradient(160deg, #0a0f1a 0%, #1a2340 55%, #3a1a2a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #title-screen h1 { font-size: 72px; font-weight: 900; font-style: italic; letter-spacing: 4px; color: #ffd76a; text-shadow: 0 4px 24px rgba(255,150,60,.5); }
  #title-screen h2 { font-size: 34px; font-weight: 800; letter-spacing: 10px; color: #e74c3c; margin-bottom: 12px; }
  #title-screen p { font-size: 16px; color: #cfe3f5; margin-bottom: 28px; }
  .title-btn { display: block; width: 320px; margin: 8px auto; padding: 14px; font-size: 20px; font-weight: 800; letter-spacing: 2px; color: #fff; background: #c0392b; border: none; border-radius: 8px; cursor: pointer; }
  .title-btn:hover { background: #e74c3c; }
  .title-btn.secondary { background: #1a5276; }
  #title-slots { margin-top: 22px; font-size: 15px; color: #9fc3e8; }
  .slot-row { padding: 4px; }
  #game-title { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 11; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
  #game-title .gt-main { font-size: 30px; font-weight: 900; font-style: italic; letter-spacing: 4px; color: #ffd76a; }
  #game-title .gt-sub { font-size: 15px; font-weight: 800; letter-spacing: 8px; color: #e74c3c; }
  #pause-menu { position: fixed; inset: 0; z-index: 30; background: rgba(10,15,26,.8); display: none; text-align: center; padding-top: 18vh; }
  #pause-menu h2 { font-size: 48px; font-weight: 900; letter-spacing: 6px; color: #ffd76a; margin-bottom: 20px; }
  #pause-menu p { font-size: 16px; color: #cfe3f5; line-height: 1.8; }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="hud-cover"></div>
  <div id="hud-money"></div>
  <div id="hud-speed"></div>
  <div id="hud-district"></div>
  <canvas id="minimap" width="160" height="160"></canvas>
</div>
<div id="game-title" style="display:none"><div class="gt-main">NEON DELTA LA</div><div class="gt-sub">DISTRICT WARS</div></div>
<div id="mission-bar"><div id="mb-title"></div><div id="mb-objective"></div><div id="mb-next"></div></div>
<div id="dialogue" style="display:none"></div>
<div id="wheel"></div>
<div id="shop-panel"></div>
<div id="title-screen">
  <h1>NEON DELTA LA</h1>
  <h2>DISTRICT WARS</h2>
  <p>6 districts &middot; 10 story jobs &middot; SWAT roadblocks &middot; 4 weapon tiers &middot; 3 save slots &middot; street races</p>
  <button class="title-btn" id="btn-new">NEW GAME</button>
  <button class="title-btn secondary" id="btn-continue">CONTINUE</button>
  <button class="title-btn secondary" id="btn-load">LOAD SLOT 1</button>
  <div id="title-slots"></div>
</div>
<div id="pause-menu"><h2>PAUSED</h2><p>WASD drive &middot; E enter/exit car &middot; Q weapon wheel &middot; 1-4 weapon tiers<br>C / V / X crew abilities &middot; Enter start mission &middot; Tab resume</p></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
