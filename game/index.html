<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Delta LA: District Wars</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0d1b2e; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: Arial, sans-serif; font-size: 22px; font-weight: 900;
    background: linear-gradient(160deg, #0d2b3e, #c24a3a); z-index: 5;
  }
</style>
</head>
<body>
<div id="loading">NEON DELTA LA: DISTRICT WARS — LOADING…</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
<script>
  // The loading veil lifts once the game has booted.
  window.addEventListener('load', function () {
    setTimeout(function () {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    }, 400);
  });
</script>
</body>
</html>
